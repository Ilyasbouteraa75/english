r:[['Digital marketing depends on engagement. Companies study analytics to understand their demographic and to improve conversion. An influencer with a strong endorsement can increase sales quickly, especially through impulse purchases. However, retention is harder, because loyalty needs good service, not only advertising.','يعتمد التسويق الرقمي على التفاعل. تدرس الشركات التحليلات لتفهم فئتها السكانية ولتحسين التحويل. يمكن لمؤثر بتأييد قوي أن يزيد المبيعات بسرعة خاصة عبر المشتريات الاندفاعية. لكن الاحتفاظ بالزبائن أصعب لأن الولاء يحتاج إلى خدمة جيدة لا إلى الإعلان فقط.',[['What can an influencer increase quickly?','sales','taxes','costs'],['What does loyalty need?','good service','more advertising','lower prices only']]]]},

s:[['coral reefs are home to many species','الشعاب المرجانية موطن لأنواع كثيرة'],['the predator hunts at night','يصطاد المفترس ليلا'],['this species is almost extinct','هذا النوع شبه منقرض'],['the ocean is a fragile ecosystem','المحيط نظام بيئي هش']],
r:[['The ocean covers most of our planet and contains incredible biodiversity. A coral reef is a marine habitat where thousands of species live together. Each predator has a role in the ecosystem, and when one species becomes extinct, the whole chain is affected. Scientists warn that warming water is damaging the reefs.','يغطي المحيط معظم كوكبنا ويضم تنوعا حيويا مذهلا. الشعاب المرجانية موطن بحري تعيش فيه آلاف الأنواع معا. لكل مفترس دور في النظام البيئي وعندما ينقرض نوع واحد تتأثر السلسلة كلها. يحذر العلماء من أن ارتفاع حرارة الماء يضر بالشعاب.',[['What happens when one species becomes extinct?','the whole chain is affected','nothing changes','the water gets colder'],['What is damaging the reefs?','warming water','heavy fishing nets','new roads']]]]},

r:[['Parenting has changed a lot in recent decades. In the past, childhood was often strict, but today many parents try to nurture creativity. During adolescence, teenagers need more freedom. In many households, grandparents live with the family, and the elderly depend on their children.','تغيرت التربية كثيرا في العقود الأخيرة. في الماضي كانت الطفولة صارمة غالبا لكن اليوم يحاول كثير من الآباء رعاية الإبداع. في فترة المراهقة يحتاج المراهقون إلى حرية أكبر. في أسر كثيرة يعيش الأجداد مع العائلة ويعتمد المسنون على أبنائهم.',[['What do teenagers need more of?','freedom','homework','discipline'],['Who depends on their children?','the elderly','the pupils','the neighbours']]]]},

r:[['Good reasoning starts with a clear premise. If the logic is weak, the conclusion cannot be trusted. A fallacy is a mistake in reasoning that looks convincing. A skeptical thinker verifies every assumption and tries to stay objective, because a subjective view can hide the truth.','يبدأ الاستدلال الجيد بمقدمة واضحة. إذا كان المنطق ضعيفا فلا يمكن الوثوق بالاستنتاج. المغالطة خطأ في الاستدلال يبدو مقنعا. يتحقق المفكر المتشكك من كل افتراض ويحاول أن يبقى موضوعيا لأن الرأي الذاتي قد يخفي الحقيقة.',[['What is a fallacy?','a mistake in reasoning that looks convincing','a very strong argument','a scientific law'],['What does a skeptical thinker do?','verifies every assumption','accepts every claim','avoids all questions']]]]}

{n:'الأساليب البلاغية',g:'السخرية sarcasm تقول عكس ما تعني، أما irony فمفارقة بين المتوقع والواقع.',w:[['irony','مفارقة'],['sarcasm','سخرية لاذعة'],['hyperbole','مبالغة'],['euphemism','تلطيف'],['rhetoric','بلاغة'],['allegory','رمزية قصصية'],['nuance','فارق دقيق'],['connotation','دلالة ضمنية'],['understatement','تقليل من الشأن'],['ambiguity','غموض']],
s:[['his sarcasm hid a deeper frustration','أخفت سخريته إحباطا أعمق'],['the speech was full of hyperbole','كان الخطاب مليئا بالمبالغة'],['she chose a gentle euphemism for the bad news','اختارت تلطيفا لطيفا للخبر السيئ'],['the ambiguity of the sentence confused everyone','حير غموض الجملة الجميع']],
r:[['Skilled speakers use rhetoric to persuade an audience. A touch of irony can make a point memorable, while hyperbole exaggerates to create impact. Understatement, on the other hand, relies on nuance and often carries a hidden connotation. A careless euphemism, however, can blur the truth and increase ambiguity.','يستخدم المتحدثون المهرة البلاغة لإقناع الجمهور. قد تجعل لمسة من السخرية الفكرة لا تنسى بينما تبالغ المبالغة لخلق الأثر. أما التقليل من الشأن فيعتمد على الفارق الدقيق وغالبا يحمل دلالة ضمنية. لكن التلطيف الطائش قد يطمس الحقيقة ويزيد الغموض.',[['What does understatement rely on?','nuance','exaggeration','repetition'],['What can a careless euphemism do?','blur the truth','prove a point','end a debate']]]]},
{n:'التعابير الاصطلاحية المتقدمة',w:[['the elephant in the room','الموضوع المحرج المتجاهل'],['turn a blind eye','يتغاضى'],['the tip of the iceberg','قمة جبل الجليد'],['a vicious circle','حلقة مفرغة'],['read between the lines','يقرأ بين السطور'],['go the extra mile','يبذل جهدا إضافيا'],['burn bridges','يحرق الجسور'],['in the long run','على المدى البعيد'],['hit rock bottom','يصل إلى القاع'],['the bottom line','الخلاصة']],
s:[['ignoring the problem is turning a blind eye','تجاهل المشكلة تغاض عنها'],['this delay is just the tip of the iceberg','هذا التأخير مجرد قمة جبل الجليد'],['in the long run honesty pays','على المدى البعيد الصدق يؤتي ثماره'],['the elephant in the room is the budget','الموضوع المحرج المتجاهل هو الميزانية']],
r:[['During the meeting nobody mentioned the elephant in the room: the budget. The manager turned a blind eye to the delays, which were only the tip of the iceberg. A vicious circle followed, because every missed deadline caused another. In the long run, only someone willing to go the extra mile could solve it, and the bottom line was clear.','أثناء الاجتماع لم يذكر أحد الموضوع المحرج المتجاهل وهو الميزانية. تغاضى المدير عن التأخيرات التي لم تكن سوى قمة جبل الجليد. تلا ذلك حلقة مفرغة لأن كل موعد نهائي فائت سبب آخر. على المدى البعيد لا يحل الأمر إلا من يبذل جهدا إضافيا وكانت الخلاصة واضحة.',[['What was the elephant in the room?','the budget','the weather','the lunch break'],['Who could solve the problem in the long run?','someone who goes the extra mile','a new consultant only','nobody']]]]},
{n:'الاقتصاد الكلي',w:[['fiscal','مالي'],['monetary','نقدي'],['deficit','عجز'],['surplus','فائض'],['austerity','تقشف'],['subsidy','دعم حكومي'],['monopoly','احتكار'],['devaluation','تخفيض قيمة العملة'],['liquidity','سيولة'],['commodity','سلعة أساسية']],
s:[['the government faces a large budget deficit','تواجه الحكومة عجزا كبيرا في الميزانية'],['austerity measures reduced public spending','خفضت إجراءات التقشف الإنفاق العام'],['the monopoly controlled the entire market','سيطر الاحتكار على السوق كله'],['the central bank changed its monetary policy','غير البنك المركزي سياسته النقدية']],
r:[['When a government spends more than it earns, it runs a deficit, and the opposite is a surplus. Fiscal policy involves taxes and spending, whereas monetary policy controls interest and liquidity. Austerity may reduce debt but can slow growth. Meanwhile, a sudden devaluation raises the price of every imported commodity, and a subsidy may protect consumers.','عندما تنفق الحكومة أكثر مما تكسب يكون هناك عجز وعكسه الفائض. تشمل السياسة المالية الضرائب والإنفاق بينما تتحكم السياسة النقدية في الفائدة والسيولة. قد يخفض التقشف الدين لكنه يبطئ النمو. وفي الأثناء يرفع التخفيض المفاجئ لقيمة العملة سعر كل سلعة مستوردة وقد يحمي الدعم المستهلكين.',[['What does monetary policy control?','interest and liquidity','taxes and spending','imports only'],['What may austerity do?','reduce debt but slow growth','increase growth quickly','remove all taxes']]]]},
{n:'علم الأحياء والوراثة',w:[['gene','جين'],['genome','جينوم'],['mutation','طفرة'],['evolution','تطور'],['heredity','وراثة'],['cell','خلية'],['cloning','استنساخ'],['enzyme','إنزيم'],['organism','كائن حي'],['chromosome','كروموسوم']],
s:[['a single mutation can change a gene','طفرة واحدة قد تغير جينا'],['the genome contains all our genetic information','يحتوي الجينوم على كل معلوماتنا الوراثية'],['evolution takes place over millions of years','يحدث التطور على مدى ملايين السنين'],['every organism is made of cells','كل كائن حي مصنوع من خلايا']],
r:[['Every organism is built from cells, and each cell carries the genome that defines it. A gene tells the cell how to make a protein, usually with the help of an enzyme. Through heredity, these instructions pass from parents to children, but a mutation can alter them. Over millions of years, such changes drive evolution, and modern cloning shows how deeply we can intervene.','يتكون كل كائن حي من خلايا وتحمل كل خلية الجينوم الذي يحددها. يخبر الجين الخلية كيف تصنع بروتينا عادة بمساعدة إنزيم. عبر الوراثة تنتقل هذه التعليمات من الآباء إلى الأبناء لكن الطفرة قد تغيرها. على مدى ملايين السنين تقود مثل هذه التغيرات التطور وتظهر الاستنساخ الحديث مدى عمق تدخلنا.',[['What passes from parents to children through heredity?','instructions in the genes','only physical strength','cultural habits'],['What can alter these instructions?','a mutation','an enzyme','a protein']]]]},
{n:'علم الاجتماع',w:[['inequality','عدم مساواة'],['marginalised','مهمش'],['solidarity','تضامن'],['stratification','تفاوت طبقي'],['norm','معيار اجتماعي'],['conformity','امتثال اجتماعي'],['deviance','انحراف عن المعايير'],['hierarchy','تسلسل هرمي'],['discrimination','تمييز'],['cohesion','تماسك']],
s:[['social inequality has deep historical roots','لعدم المساواة الاجتماعية جذور تاريخية عميقة'],['solidarity matters in a crisis','التضامن مهم وقت الأزمات'],['discrimination damages social cohesion','يضر التمييز بالتماسك الاجتماعي'],['conformity pressure affects every group','يؤثر ضغط الامتثال في كل مجموعة']],
r:[['Sociologists study how norms shape behaviour. In a rigid hierarchy, conformity is rewarded and deviance is punished. When inequality grows, marginalised groups lose trust in institutions, and discrimination weakens cohesion. Strong solidarity, by contrast, helps societies endure social stratification without collapsing.','يدرس علماء الاجتماع كيف تشكل المعايير السلوك. في تسلسل هرمي صارم يكافأ الامتثال ويعاقب الانحراف. عندما يزداد عدم المساواة تفقد الفئات المهمشة الثقة بالمؤسسات ويضعف التمييز التماسك. أما التضامن القوي فيساعد المجتمعات على تحمل التفاوت الطبقي دون أن تنهار.',[['What is rewarded in a rigid hierarchy?','conformity','deviance','creativity'],['What helps societies endure stratification?','strong solidarity','higher taxes','longer working hours']]]]},
{n:'الفيزياء والكون',w:[['quantum','كمي'],['relativity','نسبية'],['velocity','سرعة متجهة'],['momentum','زخم'],['radiation','إشعاع'],['spectrum','طيف'],['particle','جسيم'],['orbit','مدار'],['magnetic','مغناطيسي'],['friction','احتكاك']],
s:[['light behaves like a particle and a wave','يتصرف الضوء كجسيم وكموجة'],['friction slows every moving object','يبطئ الاحتكاك كل جسم متحرك'],['the planet follows an elliptical orbit','يتبع الكوكب مدارا إهليلجيا'],['radiation can be dangerous in large doses','قد يكون الإشعاع خطيرا بجرعات كبيرة']],
r:[['Quantum theory describes the behaviour of every particle at a tiny scale, while relativity explains gravity and motion at high velocity. An object with large momentum is hard to stop, especially when friction is small. Planets stay in orbit because of balanced forces, and a magnetic field protects the earth from harmful radiation. Scientists even split light into a spectrum to learn about distant stars.','تصف النظرية الكمية سلوك كل جسيم على مقياس ضئيل بينما تفسر النسبية الجاذبية والحركة بسرعات عالية. يصعب إيقاف جسم ذي زخم كبير خاصة عندما يكون الاحتكاك صغيرا. تبقى الكواكب في مدارها بسبب قوى متوازنة ويحمي مجال مغناطيسي الأرض من الإشعاع الضار. بل يحلل العلماء الضوء إلى طيف ليعرفوا عن نجوم بعيدة.',[['What protects the earth from harmful radiation?','a magnetic field','the clouds','the ocean'],['What do scientists learn from a spectrum?','information about distant stars','the age of the oceans','the weather']]]]},
{n:'علم اللغة',w:[['syntax','تركيب الجملة'],['phonetics','علم الأصوات'],['dialect','لهجة'],['semantics','علم الدلالة'],['etymology','أصل الكلمة'],['idiom','عبارة اصطلاحية'],['lexicon','معجم'],['pronunciation','نطق'],['linguist','لغوي'],['morphology','علم الصرف']],
s:[['the linguist studies the syntax of the language','يدرس اللغوي تركيب جملة اللغة'],['every dialect has its own lexicon','لكل لهجة معجمها الخاص'],['etymology reveals the origin of a word','يكشف علم أصل الكلمة منشأ الكلمة'],['correct pronunciation takes years of practice','يحتاج النطق الصحيح إلى سنوات من الممارسة']],
r:[['A linguist studies language on several levels. Phonetics deals with sounds and pronunciation, morphology with the structure of words, and syntax with how sentences are built. Semantics analyses meaning, and etymology traces the history of a word. Each dialect adds its own lexicon and idioms, which makes language a living system.','يدرس اللغوي اللغة على مستويات عدة. يعنى علم الأصوات بالأصوات والنطق وعلم الصرف ببنية الكلمات والنحو بكيفية بناء الجمل. يحلل علم الدلالة المعنى ويتتبع علم أصل الكلمة تاريخها. تضيف كل لهجة معجمها وعباراتها الاصطلاحية مما يجعل اللغة نظاما حيا.',[['What does morphology deal with?','the structure of words','the sound of speech','the history of a word'],['What does each dialect add?','its own lexicon and idioms','a new alphabet','a new grammar book']]]]},

r:[['Bioethics asks difficult questions about modern medicine. A transplant can save a life, but the supply of a suitable organ is limited, so a donor must be chosen fairly. Genetic information raises concerns about confidentiality, and any protocol must include safeguards for vulnerable groups. Critics warn against paternalism, where doctors decide everything for the patient.','تطرح أخلاقيات الطب الحيوي أسئلة صعبة عن الطب الحديث. قد تنقذ زراعة الأعضاء حياة لكن عرض العضو المناسب محدود لذلك يجب اختيار المتبرع بعدالة. تثير المعلومات الوراثية مخاوف بشأن السرية ويجب أن يشمل أي بروتوكول ضمانات للفئات الضعيفة. ويحذر النقاد من الأبوية حيث يقرر الأطباء كل شيء عن المريض.',[['Why must a donor be chosen fairly?','the supply of organs is limited','donors are always paid','organs are cheap'],['What do critics warn against?','paternalism','transplants','confidentiality']]]]}
);

s:[['the prosecution presented strong evidence','قدم الادعاء أدلة قوية'],['the defence asked for bail','طلب الدفاع كفالة'],['the judge warned him about perjury','حذره القاضي من شهادة الزور'],['she was released on parole after two years','أفرج عنها إفراجا مشروطا بعد سنتين']],
r:[['In a criminal case, the prosecution must prove guilt beyond doubt, and the defence challenges that proof. A felony is more serious than a misdemeanour, and the accused may enter a plea before the trial. Lying under oath is called perjury. After a conviction, the court may impose probation, or later grant parole, and bail allows release before the verdict.','في القضية الجنائية يجب أن يثبت الادعاء الذنب بما لا يدع مجالا للشك ويطعن الدفاع في ذلك الإثبات. الجناية أخطر من الجنحة وقد يقدم المتهم إقرارا قبل المحاكمة. يسمى الكذب تحت القسم شهادة زور. بعد الإدانة قد تفرض المحكمة اختبارا قضائيا أو تمنح لاحقا إفراجا مشروطا وتسمح الكفالة بالإفراج قبل الحكم.',[['What must the prosecution prove?','guilt beyond doubt','innocence','a motive only'],['What is lying under oath called?','perjury','probation','bail']]]]},
{n:'علوم المناخ المتقدمة',w:[['carbon','كربون'],['sequestration','احتجاز الكربون'],['biomass','كتلة حيوية'],['deforestation','إزالة الغابات'],['greenhouse','دفيئة'],['mitigation','تخفيف الأثر'],['adaptation','تكيف'],['footprint','بصمة'],['ozone','أوزون'],['sustainability','استدامة']],
s:[['deforestation reduces the capacity of forests to absorb carbon','تقلل إزالة الغابات قدرة الغابات على امتصاص الكربون'],['we must reduce our carbon footprint','يجب أن نقلل بصمتنا الكربونية'],['the ozone layer is slowly recovering','طبقة الأوزون تتعافى ببطء'],['adaptation is as important as mitigation','التكيف لا يقل أهمية عن التخفيف']],
r:[['Greenhouse gases trap heat, and carbon released by burning fuel is the main cause. Deforestation worsens the problem because forests normally store carbon, and sequestration projects try to capture it underground. Mitigation aims to reduce emissions, whereas adaptation prepares communities for change. Even biomass energy must be judged by its footprint, and the ozone layer shows that global action can work.','تحبس غازات الدفيئة الحرارة والكربون المنطلق من حرق الوقود هو السبب الرئيسي. تزيد إزالة الغابات المشكلة سوءا لأن الغابات تخزن الكربون عادة وتحاول مشاريع الاحتجاز التقاطه تحت الأرض. يهدف التخفيف إلى تقليل الانبعاثات بينما يهيئ التكيف المجتمعات للتغير. حتى طاقة الكتلة الحيوية يجب أن تقاس ببصمتها وتظهر طبقة الأوزون أن العمل العالمي يمكن أن ينجح.',[['What does mitigation aim to do?','reduce emissions','prepare communities for change','plant more crops'],['Why does deforestation worsen the problem?','forests normally store carbon','forests produce heat','forests cause floods']]]]},
{n:'البحث الأكاديمي',w:[['plagiarism','سرقة علمية'],['citation','استشهاد'],['methodology','منهجية بحث'],['empirical','تجريبي'],['dissertation','رسالة علمية'],['journal','مجلة علمية'],['bibliography','قائمة المراجع'],['peer','نظير'],['fellowship','زمالة بحثية'],['seminar','ندوة']],
s:[['plagiarism is a serious offence at university','السرقة العلمية جريمة خطيرة في الجامعة'],['every citation must appear in the bibliography','يجب أن يظهر كل استشهاد في قائمة المراجع'],['her dissertation used an empirical methodology','استخدمت رسالتها منهجية تجريبية'],['the journal accepted the article after peer review','قبلت المجلة المقال بعد مراجعة الأقران']],
r:[['A good dissertation begins with a clear methodology and relies on empirical evidence. Every citation must be accurate, and a long bibliography shows careful reading. Plagiarism, by contrast, destroys credibility. Before a journal publishes a study, a peer reads it critically, and later a seminar or fellowship may give the author a chance to develop the idea further.','تبدأ الرسالة الجيدة بمنهجية واضحة وتعتمد على أدلة تجريبية. يجب أن يكون كل استشهاد دقيقا وتظهر قائمة المراجع الطويلة قراءة متأنية. أما السرقة العلمية فتدمر المصداقية. قبل أن تنشر مجلة دراسة يقرأها زميل بنظرة نقدية وقد تمنح ندوة أو زمالة لاحقا الكاتب فرصة لتطوير الفكرة.',[['What does plagiarism destroy?','credibility','a bibliography','a seminar'],['Who reads a study before a journal publishes it?','a peer','the author family','a banker']]]]},

r:[['Cybersecurity teams defend networks against phishing, malware, and every kind of breach. A firewall filters traffic, and authentication confirms who a user really is. When a vulnerability is discovered, engineers release a patch quickly. After an incident, forensic specialists examine logs to learn how stolen credentials were used.','تدافع فرق الأمن السيبراني عن الشبكات ضد التصيد والبرمجيات الخبيثة وكل أنواع الاختراق. يرشح الجدار الناري الحركة ويؤكد التوثيق هوية المستخدم الحقيقية. عند اكتشاف ثغرة يصدر المهندسون ترقيعا بسرعة. وبعد الحادثة يفحص المختصون الجنائيون السجلات ليعرفوا كيف استخدمت بيانات الاعتماد المسروقة.',[['What does authentication confirm?','who a user really is','how fast a network is','which firewall to buy'],['What do engineers release for a vulnerability?','a patch','a new device','a contract']]]]},

s:[['a utilitarian measures the outcome of an action','يقيس النفعي نتيجة الفعل'],['conscience tells us what we owe others','يخبرنا الضمير بما ندين به للآخرين'],['altruism means acting for the benefit of others','الإيثار يعني التصرف لمصلحة الآخرين'],['moral relativism denies universal rules','تنكر النسبية الأخلاقية القواعد العامة']],
r:[['A utilitarian judges actions by their results, whereas a deontological thinker focuses on obligation and a categorical imperative that applies to everyone. Relativism rejects universal rules, and egoism claims that self interest is enough. Altruism, on the other hand, acts for others, even at personal cost. Conscience, many argue, is where these theories meet our daily scruples.','يحكم النفعي على الأفعال بنتائجها بينما يركز المفكر الواجبي على الالتزام وعلى أمر قطعي ينطبق على الجميع. ترفض النسبية القواعد العامة وتدعي الأنانية أن المصلحة الذاتية تكفي. أما الإيثار فيتصرف من أجل الآخرين حتى بكلفة شخصية. ويرى كثيرون أن الضمير هو المكان الذي تلتقي فيه هذه النظريات بتحرجاتنا اليومية.',[['How does a utilitarian judge actions?','by their results','by tradition','by feelings only'],['What does altruism mean?','acting for others','acting for profit','avoiding every rule']]]]},
{n:'تاريخ الأفكار والتنوير',w:[['enlightenment','التنوير'],['renaissance','عصر النهضة'],['empiricism','تجريبية فلسفية'],['rationalism','عقلانية'],['humanism','إنسانية فكرية'],['dogma','عقيدة جامدة'],['secular','علماني'],['manuscript','مخطوطة'],['scholar','عالم دارس'],['treatise','رسالة فكرية']],
s:[['the enlightenment valued reason above tradition','قدر التنوير العقل فوق التقاليد'],['a monk copied the manuscript by hand','نسخ راهب المخطوطة بيده'],['the renaissance revived interest in ancient art','أحيت النهضة الاهتمام بالفن القديم'],['the scholar wrote a treatise on politics','كتب العالم رسالة فكرية عن السياسة']],
r:[['The renaissance revived humanism and the study of ancient manuscripts. Later, the enlightenment praised rationalism, while empiricism argued that knowledge comes from experience. A scholar of that age might write a treatise attacking dogma and defending a secular society. These ideas, though old, still shape how we debate freedom and authority.','أحيت النهضة الإنسانية ودراسة المخطوطات القديمة. ثم أشاد التنوير بالعقلانية بينما رأت التجريبية أن المعرفة تأتي من الخبرة. قد يكتب عالم تلك الحقبة رسالة تهاجم العقيدة الجامدة وتدافع عن مجتمع علماني. وهذه الأفكار على قدمها لا تزال تشكل كيف نناقش الحرية والسلطة.',[['What did empiricism argue?','knowledge comes from experience','knowledge comes from tradition','knowledge cannot exist'],['What might a scholar of that age attack?','dogma','manuscripts','experience']]]]}

s:[['she is meticulous about every detail','هي دقيقة جدا في كل تفصيل'],['fame is ephemeral and fades quickly','الشهرة عابرة وتزول سريعا'],['smartphones are ubiquitous in modern life','الهواتف الذكية منتشرة في كل مكان في الحياة الحديثة'],['he gave a laconic reply','أعطى ردا موجزا']],
r:[['The editor was meticulous, almost fastidious, and rejected any argument that was not cogent. Her style was laconic, because she believed that clarity should never be sacrificed for decoration. Although she felt ambivalent about fame, which she considered ephemeral, she remained tenacious in defending her principles. Her pragmatic approach to deadlines was admired in an industry where esoteric debates are ubiquitous.','كانت المحررة دقيقة جدا حتى التشدد ورفضت أي حجة ليست مقنعة. كان أسلوبها موجزا لأنها آمنت بأن الوضوح لا يجوز التضحية به من أجل الزخرفة. ورغم أنها كانت متناقضة المشاعر تجاه الشهرة التي اعتبرتها عابرة ظلت عنيدة في الدفاع عن مبادئها. وقد حظي نهجها العملي في المواعيد بالإعجاب في صناعة تنتشر فيها النقاشات الغامضة.',[['Why was her style laconic?','she believed clarity should not be sacrificed','she had little time','she disliked editors'],['How did she feel about fame?','ambivalent','delighted','indifferent']]]]},
{n:'الأمثال الإنجليزية',g:'الأمثال تحمل حكمة جاهزة، وتعلمها كعبارات كاملة بمعناها لا حرفيا.',w:[['a stitch in time saves nine','درهم وقاية خير من قنطار علاج'],['actions speak louder than words','الأفعال أبلغ من الأقوال'],['the pen is mightier than the sword','القلم أقوى من السيف'],['every cloud has a silver lining','في كل ضيق فرج'],['a rolling stone gathers no moss','كثرة التنقل تمنع الاستقرار'],['look before you leap','فكر قبل أن تقدم'],['where there is smoke there is fire','لا دخان بلا نار'],['too many cooks spoil the broth','كثرة الطباخين تفسد الطبخة'],['better late than never','أن تصل متأخرا خير من ألا تصل'],['the grass is always greener on the other side','العشب أخضر دائما عند الآخرين']],
s:[['a stitch in time saves nine so fix it now','الوقاية خير من العلاج فأصلحه الآن'],['actions speak louder than words','الأفعال أبلغ من الأقوال'],['where there is smoke there is fire','لا دخان بلا نار'],['look before you leap and read the contract','فكر قبل أن تقدم واقرأ العقد']],
r:[['My grandfather loved proverbs. He used to say that a stitch in time saves nine, and that actions speak louder than words. When my sister hesitated about a risky job, he advised her to look before she leaps. Later, when plans failed, he reminded us that every cloud has a silver lining.','كان جدي يحب الأمثال. كان يقول إن درهم وقاية خير من قنطار علاج وإن الأفعال أبلغ من الأقوال. وعندما ترددت أختي في وظيفة محفوفة بالمخاطر نصحها أن تفكر قبل أن تقدم. وفي وقت لاحق عندما فشلت الخطط ذكرنا بأن في كل ضيق فرجا.',[['What did he advise his sister to do?','look before she leaps','take the job at once','quit working'],['What did he remind them when plans failed?','every cloud has a silver lining','better late than never','too many cooks spoil the broth']]]]},
{n:'الأدب الإنجليزي الكلاسيكي',w:[['sonnet','سوناتة'],['couplet','مقطع من بيتين'],['epic','ملحمة'],['pastoral','رعوي'],['romanticism','رومانسية'],['gothic','قوطي'],['allusion','تلميح أدبي'],['pathos','إثارة الشفقة'],['bard','شاعر'],['parody','محاكاة ساخرة']],
s:[['the sonnet follows a strict rhyme scheme','تتبع السوناتة نظام قافية صارما'],['the poet used a clever allusion','استخدم الشاعر تلميحا أدبيا ذكيا'],['romanticism praised emotion and nature','أشادت الرومانسية بالعاطفة والطبيعة'],['the film is a parody of a gothic novel','الفيلم محاكاة ساخرة لرواية قوطية']],
r:[['The bard of the Elizabethan age wrote a sonnet that ends with a rhyming couplet. Later, romanticism turned to nature, while the gothic novel preferred mystery and fear. A pastoral poem praises country life, and an epic tells the deeds of a hero. Writers often use a subtle allusion or a gentle parody, hoping to move the reader with pathos.','كتب شاعر العصر الإليزابيثي سوناتة تنتهي بمقطع مقفى. لاحقا اتجهت الرومانسية إلى الطبيعة بينما فضلت الرواية القوطية الغموض والخوف. تمدح القصيدة الرعوية حياة الريف وتروي الملحمة أعمال بطل. وكثيرا ما يستخدم الكتاب تلميحا خفيا أو محاكاة ساخرة لطيفة على أمل تحريك القارئ بالشفقة.',[['How does a sonnet end?','with a rhyming couplet','with a long speech','with a question'],['What does a pastoral poem praise?','country life','war','the sea']]]]},
{n:'الفلسفة التحليلية',w:[['epistemology','نظرية المعرفة'],['ontology','علم الوجود'],['metaphysics','ميتافيزيقا'],['dialectic','جدل فلسفي'],['axiom','بديهية'],['syllogism','قياس منطقي'],['solipsism','ذاتية مطلقة'],['nihilism','عدمية'],['determinism','حتمية'],['teleology','غائية']],
s:[['epistemology asks how we know anything','تسأل نظرية المعرفة كيف نعرف أي شيء'],['an axiom needs no proof','البديهية لا تحتاج إلى برهان'],['nihilism denies that life has meaning','تنكر العدمية أن للحياة معنى'],['determinism claims that every event has a cause','تدعي الحتمية أن لكل حدث سببا']],
r:[['Epistemology examines the limits of knowledge, while ontology asks what exists. Metaphysics goes further, and the dialectic method moves through contradiction. A syllogism draws a conclusion from an axiom, but solipsism doubts everything except the self. Nihilism and determinism, each in its own way, challenge the idea of free will, and teleology claims that everything has a purpose.','تفحص نظرية المعرفة حدود المعرفة بينما يسأل علم الوجود ماذا يوجد. وتذهب الميتافيزيقا أبعد ويتحرك المنهج الجدلي عبر التناقض. يستخلص القياس المنطقي نتيجة من بديهية لكن الذاتية المطلقة تشك في كل شيء إلا الذات. وتتحدى العدمية والحتمية كل بطريقتها فكرة الإرادة الحرة وتدعي الغائية أن لكل شيء غاية.',[['What does ontology ask?','what exists','how we know','what is beautiful'],['What does solipsism doubt?','everything except the self','only science','only history']]]]},
{n:'الاقتصاد السياسي',w:[['neoliberalism','ليبرالية جديدة'],['mercantilism','مذهب تجاري'],['protectionism','حمائية'],['oligarchy','حكم الأقلية'],['hegemony','هيمنة'],['cartel','كارتل'],['autarky','اكتفاء ذاتي'],['usury','ربا'],['rentier','ريعي'],['redistribution','إعادة توزيع']],
s:[['protectionism raises the price of imported goods','ترفع الحمائية أسعار السلع المستوردة'],['a cartel controls the price of oil','يتحكم كارتل في سعر النفط'],['the oligarchy held power for decades','احتكرت حكومة الأقلية السلطة لعقود'],['redistribution aims to reduce inequality','تهدف إعادة التوزيع إلى تقليل التفاوت']],
r:[['Neoliberalism favours free markets, whereas protectionism and mercantilism favour state control of trade. In an oligarchy, a small elite holds power, and hegemony allows a dominant state to shape global rules. A cartel can fix prices, and a rentier lives from property rather than work. Some societies attempt autarky, while others call for redistribution to correct inequality; in older times, usury was widely condemned.','تفضل الليبرالية الجديدة الأسواق الحرة بينما تفضل الحمائية والتجارية سيطرة الدولة على التجارة. في حكم الأقلية تحتفظ نخبة صغيرة بالسلطة وتتيح الهيمنة لدولة مسيطرة أن تشكل القواعد العالمية. يستطيع الكارتل تثبيت الأسعار ويعيش الريعي من الملكية لا من العمل. تحاول بعض المجتمعات الاكتفاء الذاتي بينما تطالب أخرى بإعادة التوزيع لتصحيح عدم المساواة وفي أزمنة أقدم كان الربا مدانا على نطاق واسع.',[['Who holds power in an oligarchy?','a small elite','the majority','foreign tourists'],['What can a cartel do?','fix prices','abolish taxes','create hegemony']]]]},

s:[['a catalyst speeds up a chemical reaction','يسرع المحفز التفاعل الكيميائي'],['each molecule contains several atoms','يحتوي كل جزيء على ذرات عدة'],['iron slowly turns to rust through oxidation','يتحول الحديد ببطء إلى صدأ عبر الأكسدة'],['water is a common solvent','الماء مذيب شائع']],
r:[['A chemist adds a reagent to a solvent to start a reaction. A catalyst makes the process faster without being consumed, and the synthesis of a new compound may produce a crystalline solid. Each molecule has a precise structure, while an isotope is a variant of the same element. A polymer is a very long chain of repeated units, and oxidation often changes its properties over time.','يضيف الكيميائي كاشفا إلى مذيب ليبدأ تفاعلا. يجعل المحفز العملية أسرع دون أن يستهلك وقد ينتج تصنيع مركب جديد مادة صلبة بلورية. لكل جزيء بنية دقيقة بينما النظير صورة من العنصر نفسه. البوليمر سلسلة طويلة جدا من وحدات متكررة وغالبا تغير الأكسدة خواصه مع الوقت.',[['What does a catalyst do?','makes a reaction faster without being consumed','destroys the solvent','creates an isotope'],['What is a polymer?','a long chain of repeated units','a type of solvent','a single atom']]]]},

r:[['An erudite speaker can be eloquent without being verbose. A terse sentence, by contrast, may seem cold, while a pompous one irritates the listener. Florid prose delights some readers, but a lucid, succinct style usually wins. In formal documents, writers avoid colloquial expressions and archaic forms alike.','يستطيع المتحدث الواسع المعرفة أن يكون بليغا دون أن يكون مسهبا. أما الجملة المقتضبة فقد تبدو باردة بينما الجملة المتفاخرة تزعج المستمع. النثر المزخرف يبهج بعض القراء لكن الأسلوب الواضح الموجز هو الذي يفوز عادة. وفي الوثائق الرسمية يتجنب الكتاب التعابير العامية والصيغ القديمة معا.',[['What usually wins according to the text?','a lucid and succinct style','florid prose','pompous sentences'],['What do writers avoid in formal documents?','colloquial and archaic forms','long sentences','legal terms']]]]},

r:[['A constitutional charter defines the powers of each branch of government. Under federalism, authority is shared between the centre and the regions. The president may use a veto, but legislators can overrule it, and a long tenure does not protect an official from impeachment. Courts may issue an injunction or a writ to protect rights, and jurisprudence slowly builds around each amendment.','يحدد ميثاق دستوري صلاحيات كل فرع من فروع الحكومة. في ظل الفدرالية تتقاسم السلطة بين المركز والأقاليم. قد يستخدم الرئيس حق النقض لكن للمشرعين تجاوزه ولا تحمي مدة ولاية طويلة مسؤولا من المساءلة. قد تصدر المحاكم أمرا قضائيا مؤقتا أو أمرا قضائيا لحماية الحقوق وينمو الفقه القانوني ببطء حول كل تعديل.',[['What does federalism do?','shares authority between the centre and regions','removes all courts','abolishes the president'],['What can legislators do to a veto?','overrule it','ignore it forever','sign it']]]]},

r:[['Cosmology tries to explain the origin of the universe. A nebula can give birth to new stars, while a supernova marks the violent death of a massive one. Redshift shows that distant galaxies are moving away, and astronomers look for an exoplanet around each constellation they study. At the centre of a black hole lies a singularity, whereas an asteroid or a comet is only a small wandering body.','تحاول علوم الكون تفسير أصل الكون. يمكن أن يلد السديم نجوما جديدة بينما يمثل المستعر الأعظم الموت العنيف لنجم ضخم. يظهر الانزياح الأحمر أن المجرات البعيدة تبتعد ويبحث الفلكيون عن كوكب خارجي حول كل كوكبة يدرسونها. وفي مركز الثقب الأسود يوجد تفرد بينما الكويكب أو المذنب جرم صغير هائم.',[['What does redshift show?','distant galaxies are moving away','stars are getting brighter','planets are cooling'],['What marks the death of a massive star?','a supernova','a nebula','a comet']]]]},

r:[['The concert opened with a short overture that introduced the main melody. Then the virtuoso soloist played a concerto, and the tempo grew faster until a powerful crescendo. Skilful counterpoint wove several voices together in harmony. After the final sonata, the audience stood for a long time, moved by the symphony of the orchestra.','افتتحت الحفلة بمقدمة موسيقية قصيرة قدمت اللحن الرئيسي. ثم عزف العازف المنفرد البارع كونشرتو وازداد الإيقاع سرعة حتى بلغ تصاعدا قويا. نسج التقابل اللحني الماهر عدة أصوات معا في تناغم. وبعد السوناتة الأخيرة وقف الجمهور طويلا متأثرا بسيمفونية الأوركسترا.',[['What introduced the main melody?','a short overture','a final sonata','a long speech'],['What happened to the tempo?','it grew faster until a crescendo','it stayed the same','it stopped suddenly']]]]},

r:[['Incorporation gives a business a legal identity separate from its owners. A subsidiary may be created to manage a specific market, and an acquisition can bring new assets. Directors have a fiduciary duty to protect shareholders, and an annual audit checks the accounts. If insolvency follows, liquidation begins, and an indemnity or covenant may decide who pays the losses; a public tender can then sell the remaining assets.','يمنح التأسيس الشركة هوية قانونية منفصلة عن مالكيها. قد تنشأ شركة تابعة لإدارة سوق محددة وقد يجلب الاستحواذ أصولا جديدة. على المديرين واجب ائتماني لحماية المساهمين ويفحص التدقيق السنوي الحسابات. وإذا أعقب ذلك إعسار تبدأ التصفية وقد يحدد التعويض أو التعهد من يدفع الخسائر ويمكن لمناقصة عامة أن تبيع الأصول المتبقية.',[['What does incorporation give a business?','a legal identity separate from its owners','free taxes','a new name only'],['What does an annual audit check?','the accounts','the products','the employees']]]]},

r:[['Sociolinguists study how groups use language. A sociolect belongs to a social class, while an idiolect belongs to one person. Contact between communities can produce a pidgin, which may later become a creole. In a situation of diglossia, the vernacular and the formal language have different roles, and orthography, phonemes, and each neologism show how language keeps changing; a calque borrows structure from another language.','يدرس علماء اللغة الاجتماعيون كيف تستخدم الجماعات اللغة. تنتمي اللهجة الاجتماعية إلى طبقة اجتماعية بينما تنتمي اللهجة الفردية إلى شخص واحد. قد ينتج الاحتكاك بين المجتمعات لغة بيجن قد تصير لاحقا كريولية. في حالة الازدواجية اللغوية يكون للعامية واللغة الرسمية أدوار مختلفة وتظهر الإملاء والوحدات الصوتية وكل لفظة مستحدثة كيف تتغير اللغة باستمرار وتستعير الترجمة الاستعارية بنية من لغة أخرى.',[['What belongs to one person?','an idiolect','a sociolect','a calque'],['What may a pidgin later become?','a creole','a dialect of Latin','a script']]]]},

r:[['In an oligopoly, a few firms dominate, and collusion can raise prices at the expense of consumers. Economists study the marginal effect of each extra unit, and diminishing returns appear when productivity falls. A monopsony has one dominant buyer, while a market tends toward equilibrium when supply and demand balance. Outsourcing may reduce cost, but the depreciation of equipment and the fungible nature of labour complicate the picture.','في احتكار القلة تهيمن شركات قليلة وقد يرفع التواطؤ الأسعار على حساب المستهلكين. يدرس الاقتصاديون الأثر الهامشي لكل وحدة إضافية وتظهر العوائد المتناقصة عندما تنخفض الإنتاجية. يملك احتكار الشراء مشتريا مهيمنا واحدا بينما يميل السوق إلى التوازن عندما يتعادل العرض والطلب. قد يخفض الاستعانة بمصادر خارجية التكلفة لكن اهتلاك المعدات وطبيعة العمل القابلة للاستبدال تعقد الصورة.',[['What can collusion do?','raise prices at the expense of consumers','lower all costs','create a monopsony'],['When does a market tend toward equilibrium?','when supply and demand balance','when one firm dominates','when taxes rise']]]]},

r:[['Geopolitics studies how geography shapes power. A peninsula or an isthmus can give a state control of trade routes, and a narrow strait often becomes a strategic point. The topography of a region, including mountains and rough terrain, affects defence and travel. Cartography records these features, while an enclave or a distant archipelago creates complex borders, and every hinterland depends on its ports.','تدرس الجغرافيا السياسية كيف تشكل الجغرافيا القوة. قد تمنح شبه جزيرة أو برزخ دولة سيطرة على طرق التجارة وغالبا يصبح المضيق الضيق نقطة استراتيجية. تؤثر تضاريس منطقة ما بما فيها الجبال والأرض الوعرة في الدفاع والسفر. يسجل رسم الخرائط هذه الملامح بينما يخلق الجيب أو الأرخبيل البعيد حدودا معقدة ويعتمد كل ظهير على موانئه.',[['What can a narrow strait become?','a strategic point','a desert','a farming area'],['What does cartography record?','geographical features','political speeches','trade prices']]]]}

r:[['The merger looked like a Pyrrhic victory from the start. The cheap loan was a Trojan horse, hiding conditions that became the Achilles heel of the whole plan. When the board finally decided to cross the Rubicon, nobody expected the Herculean task of rebuilding trust. It was, many agreed, a Faustian bargain, and the swan song of the old chairman.','بدا الاندماج نصرا باهظ الثمن منذ البداية. كان القرض الرخيص حصان طروادة يخفي شروطا صارت نقطة ضعف الخطة كلها. عندما قرر المجلس أخيرا اتخاذ قرار لا رجعة فيه لم يتوقع أحد المهمة الشاقة لإعادة بناء الثقة. كان ذلك كما اتفق كثيرون صفقة شيطانية والعمل الأخير للرئيس القديم.',[['What was the Trojan horse in the story?','the cheap loan','the old chairman','the new board'],['What did nobody expect?','the Herculean task of rebuilding trust','a quick victory','a new loan']]]]},

r:[['Criminology studies why people commit offences such as larceny, forgery, extortion, or embezzlement. Some theories stress deterrence, while others focus on rehabilitation, because recidivism remains high. Judges consider culpability and any mitigating circumstances before sentencing. A vigilante who takes the law into his own hands, however, damages trust in the legal system.','يدرس علم الجريمة لماذا يرتكب الناس جرائم مثل السرقة والتزوير والابتزاز أو الاختلاس. تؤكد بعض النظريات الردع بينما تركز أخرى على التأهيل لأن العودة إلى الجريمة تبقى مرتفعة. يراعي القضاة المسؤولية الجنائية وأي ظروف مخففة قبل إصدار الحكم. أما المقتص بنفسه الذي يأخذ القانون بيده فيضر بالثقة في النظام القانوني.',[['Why do some theories focus on rehabilitation?','recidivism remains high','prisons are empty','laws are old'],['What damages trust in the legal system?','a vigilante','a judge','a clerk']]]]},

r:[['Modernism broke with tradition and often used fragmentation to reflect a confusing world. Postmodernism went further, playing with intertextuality and doubting every grand story. A dystopia warns of the future, while a utopia imagines an ideal society. Some authors prefer an epistolary novella, others a memoir, and many appear together in a single anthology.','قطعت الحداثة مع التقليد وغالبا استخدمت التفكك لتعكس عالما مربكا. ذهبت ما بعد الحداثة أبعد فلعبت بالتناص وشككت في كل سردية كبرى. تحذر الديستوبيا من المستقبل بينما تتخيل اليوتوبيا مجتمعا مثاليا. يفضل بعض المؤلفين روايات قصيرة رسائلية وآخرون المذكرات ويظهر كثيرون معا في مختارات واحدة.',[['What does a dystopia do?','warns of the future','imagines an ideal society','praises tradition'],['What did modernism often use?','fragmentation','intertextuality only','rhyming couplets']]]]},

s:[['the bailout prevented a wider collapse','منعت خطة الإنقاذ انهيارا أوسع'],['the country announced a moratorium on debt payments','أعلنت الدولة تأجيلا رسميا لسداد الديون'],['sovereign bonds lost value after the default','فقدت السندات السيادية قيمتها بعد التخلف عن السداد'],['stagflation combines high prices with slow growth','يجمع الركود التضخمي بين أسعار مرتفعة ونمو بطيء']],

r:[['Pharmacology studies how drugs act on the body. A doctor will prescribe a tablet only after checking every contraindication, and a generic drug usually has the same effect as the original. A sedative calms the patient, an analgesic reduces pain, and an antidote counters a poison. Careful dosing matters, because even a useful medicine can show toxicity in excess; a syringe delivers it directly into the blood.','يدرس علم الأدوية كيف تؤثر العقاقير في الجسم. يصف الطبيب قرصا بعد التحقق من كل مانع استعمال ويكون للدواء الجنيس عادة التأثير نفسه كالأصلي. يهدئ المهدئ المريض ويخفف المسكن الألم ويقاوم الترياق السم. ويهم ضبط الجرعة لأن حتى الدواء المفيد قد يظهر سمية عند الإفراط وتوصله المحقنة مباشرة إلى الدم.',[['What does a doctor check before prescribing a tablet?','every contraindication','the patient salary','the weather'],['What does an antidote do?','counters a poison','reduces pain','calms the patient']]]]},

const day=(o=0)=>{const d=new Date(Date.now()-o*864e5);return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
const sk=()=>P.last===day()||P.last===day(1)?P.streak:0;
const touch=()=>{if(P.last!==day()){P.streak=P.last===day(1)?P.streak+1:1;P.last=day()}};
let VO=[];const loadV=()=>{try{VO=speechSynthesis.getVoices()}catch(e){}};try{loadV();speechSynthesis.onvoiceschanged=loadV}catch(e){}
const note=m=>{let n=$('#note');if(!n){n=document.createElement('div');n.id='note';n.className='msg bad';A.prepend(n)}n.textContent=m};
const speak=t=>{if(!('speechSynthesis' in window))return note('الصوت غير مدعوم هنا');try{const s=speechSynthesis;s.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.85;const v=VO.find(x=>/^en[-_]US/i.test(x.lang))||VO.find(x=>/^en/i.test(x.lang));if(v)u.voice=v;setTimeout(()=>s.speak(u),60)}catch(e){}};
const mk=(c,t,f)=>{const b=document.createElement('button');b.className=c;b.textContent=t;b.onclick=f;return b};
const ORDER=['A1','A2','B1','B2','C1','C2'];
const ST=ORDER.filter(k=>DATA[k]).map(k=>({k,t:DATA[k].t,L:DATA[k].t.length*5}));
const sp=k=>P.st[k]||(P.st[k]={d:0,x:0,s:[]});
const pool=s=>s._p||(s._p=s.t.flatMap(x=>x.w));
const sw=s=>s._w||(s._w=[...new Set(pool(s).map(x=>x[0]).filter(w=>!w.includes(' ')))]);
const dist=(pl,it,i,n)=>sh(pl.filter(x=>x[0]!==it[0])).slice(0,n).map(x=>x[i]);
const G={
 q:(it,s,b)=>({k:'q',ar:it[1],en:it[0],o:sh([it[0],...dist(pool(s),it,0,b>1?3:2)])}),
 h:(it,s)=>({k:'h',ar:it[1],en:it[0],o:sh([it[1],...dist(pool(s),it,1,3)])}),
 t:it=>({k:'t',ar:it[1],en:it[0]}),
 d:(it,s,b)=>({k:'d',ar:it[1],en:it[0],dif:b||0}),
 b:(it,s,b)=>({k:'b',ar:it[1],en:it[0],x:sh(sw(s)).filter(w=>!it[0].split(' ').includes(w)).slice(0,Math.min(1+b,3))}),
 f:(it,s,b)=>{const tk=it[0].split(' '),c=tk.map((w,i)=>i).filter(i=>tk[i].length>2),i=c.length?rnd(c):0,a=tk[i];
  return{k:'f',dif:b||0,ar:it[1],en:it[0],a,bl:tk.map((w,j)=>j===i?'____':w).join(' '),o:sh([a,...sh(sw(s).filter(w=>w!==a)).slice(0,3)])}}
};
const PLAN=[['m4','q','q','q','h'],['h','h','h','f','f','d','d'],['b','b','q','q','f'],['t','t','t','b','sd'],['m5','t','t','sd','st','b','b','r']];
function build(s,i){
 const tp=s.t[Math.floor(i/5)],b=Math.floor(i/20)+ORDER.indexOf(s.k)*2,W=tp.w,SS=tp.s.length?tp.s:W,dw=dq(W),ds=dq(SS);
 return PLAN[i%5].flatMap(c=>{
  if(c==='r'){const r=tp.r&&rnd(tp.r);return r?r[2].map(q=>({k:'rq',tx:r[0],tr:r[1],q:q[0],a:q[1],o:sh(q.slice(1))})):[]}
  if(c[0]==='m')return{k:'m',p:sh(W).slice(0,+c[1])};
  if(c==='q'&&Math.random()<Math.min(b/8,.85))c='t';
  if(c==='t'&&b>=6)c='st';
  const sen=['b','f','sd','st'].includes(c),g=c==='sd'?'d':c==='st'?'t':c;
  return G[g](sen?ds():dw(),s,b);
 });
}
let cur=0,S;
function home(){
 const s=ST[cur],p=sp(s.k),un=k=>k===0||sp(ST[k-1].k).x;
 let h=`<div class=hdr><span>🔥 ${sk()}</span><span>⭐ ${P.xp} XP</span><span>مستواك ${Math.floor(P.xp/100)+1}</span></div><div class=stg>`+
 ORDER.map(k=>{const i=ST.findIndex(x=>x.k===k);return i<0?`<button disabled>${k}</button>`:`<button class="${i===cur?'on':''}" ${un(i)?'':'disabled'} onclick="cur=${i};home()">${k}${un(i)?'':' 🔒'}</button>`}).join('')+
 `</div><p class=sub>أنجزت ${p.d} من ${s.L} مستوى</p><div class=bar><i style="width:${p.d/s.L*100}%"></i></div>`;
 for(let i=0;i<s.L;i++){
  if(i%20===0)h+=`<h3>الكتلة ${i/20+1}</h3>`;
  if(i%10===0)h+=`<div class=blk><div><b>📘 درس ${i/10+1}</b><br><small>${s.t.slice(i/5,i/5+2).map(t=>t.n).join(' · ')}</small></div><button class=lnk onclick="lesson(ST[cur],${i/10},0)">فتح الدرس</button></div><div class=g5>`;
  h+=`<button class="lv5 ${i<p.d?'ok':i===p.d?'cur':''}" ${i>p.d?'disabled':''} onclick="play(ST[cur],${i})"><b>${i+1}</b><small>${'★'.repeat(p.s[i]||0)}</small></button>`;
  if(i%10===9||i===s.L-1)h+='</div>';
 }
 h+=p.d>=s.L?(p.x?`<div class=pass>🎓 اجتزت ${s.k}</div>`:`<button class=go onclick="exam()">اختبار ${s.k} النهائي</button>`):'<p class=sub>أنهِ كل المستويات لتفتح الاختبار النهائي.</p>';
 h+=`<button class=lnk onclick="review()">🔁 مراجعة أخطائي (${P.wrong.length})</button><button class=lnk onclick="backup()">نسخ احتياطي للتقدم</button>`;
 A.innerHTML=h;
}
function lesson(s,u,go){
 const ts=s.t.slice(u*2,u*2+2);(sp(s.k).ls=sp(s.k).ls||{})['u'+u]=1;save();
 A.innerHTML=`<h1>درس ${u+1}</h1><p class=sub>${ts.length} مواضيع بكل كلماتها وجملها. اضغط على أي سطر لتسمعه، ثم تدرب بلا قلوب قبل أن تبدأ.</p>`+ts.map(t=>`<h3>${t.n}</h3>${t.g?`<p class=tip>${t.g}</p>`:''}<div class=les>${t.w.map(p=>`<button class=c data-s="${p[0]}"><b dir=ltr>${p[0]}</b> = ${p[1]}</button>`).join('')}${t.s.map(p=>`<button class=c data-s="${p[0]}"><b dir=ltr>${p[0]}</b><br>${p[1]}</button>`).join('')}</div>`).join('')+`<button class=go onclick="practice(${ST.indexOf(s)},${u})">تدرب أولا بدون قلوب</button><button class=go style="background:var(--card);color:var(--ink);border:2px solid var(--line)" onclick="${go?'step()':'home()'}">${go?'ابدأ المستوى '+(S.i+1):'رجوع'}</button>`;
 document.querySelectorAll('.les button').forEach(b=>b.onclick=()=>speak(b.dataset.s));
}
function practice(si,u){
 const s=ST[si],ts=s.t.slice(u*2,u*2+2),xs=[];
 ts.forEach((t,j)=>{const W=t.w,SS=t.s.length?t.s:W,dw=dq(W),ds=dq(SS);xs.push({k:'m',p:sh(W).slice(0,4)},G.q(dw(),s,0),G.h(dw(),s,0),G.f(ds(),s,0));if(j===ts.length-1)xs.push(G.b(ds(),s,0),G.t(dw()),G.d(dw(),s,0))});
 S={s,i:u*10,k:0,h:99,xs,pr:1,u};step();
}
function prEnd(){A.innerHTML=`<h1>أحسنت ✅</h1><p class=sub>أنهيت التدريب على الدرس ${S.u+1}. هل صرت جاهزا للمستويات؟</p>${S.u*10<=sp(S.s.k).d?`<button class=go onclick="play(S.s,S.u*10,1)">ابدأ المستوى ${S.u*10+1}</button>`:''}<button class=lnk onclick="lesson(S.s,S.u,0)">راجع الدرس</button><button class=lnk onclick="home()">الخريطة</button>`}
function play(s,i,skip){S={s,i,k:0,h:3,xs:build(s,i)};i%10===0&&!skip&&!(sp(s.k).ls||{})['u'+i/10]?lesson(s,i/10,1):step()}
function hearts(){$('.h').innerHTML=S.x?'اختبار':S.rv?'مراجعة':S.pr?'تدريب':'♥'.repeat(S.h)+'<s>'+'♥'.repeat(3-S.h)+'</s>'}
function step(){
 const st=S.xs[S.k];
 if(!st)return S.x?fin():S.rv?rvEnd():S.pr?prEnd():win();
 S.cur=st;
 A.innerHTML=`<div class=top><button class=x onclick="home()" aria-label="خروج">✕</button><div class=bar><i style="width:${S.k/S.xs.length*100}%"></i></div><div class=h></div></div><div id=g></div><div id=fb></div>`;
 hearts();({m:gm,b:gb,d:gd,t:gd,q:gq,h:gq,f:gq,rq:gq})[st.k](st);
}
function ok(txt){
 touch();if(!S.x&&!S.pr)P.xp+=10;
 if(S.rv&&S.cur.en)P.wrong=P.wrong.filter(w=>w[0]!==S.cur.en);
 save();const go=$('.go');if(go)go.style.display='none';
 $('#fb').innerHTML=`<div class="msg good">صحيح! ✓ ${txt?'<bdi>'+txt+'</bdi>':''}</div><button class="go nx" onclick="S.k++;step()">التالي</button>`;
 $('.nx').focus();
}
function bad(a){
 const c=S.cur;if(!S.pr&&c&&c.en&&c.ar&&!P.wrong.some(w=>w[0]===c.en)){P.wrong.push([c.en,c.ar]);P.wrong=P.wrong.slice(-40)}save();
 if(S.x){S.miss++;$('#fb').innerHTML='<div class="msg bad">إجابة خاطئة'+(a?' — الصحيح: <bdi>'+a+'</bdi>':'')+'</div>';document.querySelectorAll('#g button,#g input').forEach(e=>e.disabled=true);setTimeout(()=>{S.k++;step()},1600);return}
 S.h--;if(S.h<=0)return lose();hearts();$('#fb').innerHTML='<div class="msg bad">غير صحيح، حاول مرة أخرى</div>';
}
function lose(){A.innerHTML=`<h1>انتهت القلوب 💔</h1><p class=sub>لا بأس، أعد المحاولة.</p><button class=go onclick="${S.rv?'review()':'play(S.s,S.i,1)'}">أعد المحاولة</button><button class=lnk onclick="home()">الخريطة</button>`}
function win(){
 const p=sp(S.s.k),stars=S.h;P.xp+=10*stars;p.s[S.i]=Math.max(p.s[S.i]||0,stars);if(S.i===p.d)p.d++;save();
 const nx=S.i+1<S.s.L;
 A.innerHTML=`<h1>أحسنت! 🎉</h1><p class=stars>${'⭐'.repeat(stars)}</p><p class=sub>أنهيت المستوى ${S.i+1} وربحت ${10*stars} XP إضافية. سلسلتك 🔥 ${sk()} يوم.</p><button class=go onclick="${nx?'play(S.s,S.i+1)':'home()'}">${nx?'المستوى التالي':'الخريطة'}</button><button class=lnk onclick="home()">الخريطة</button>`;
}
function gm(st){
 let a=null,n=st.p.length;
 $('#g').innerHTML='<p class=q>اربط كل كلمة بمعناها</p><div class=mt></div>';
 [0,1].forEach(ci=>{const d=document.createElement('div');sh(st.p).forEach(p=>{
  const b=mk('c'+(ci?'':' en'),p[ci],()=>{
   if(b.disabled)return;if(!ci)speak(p[0]);
   if(!a||a.ci===ci){a&&a.b.classList.remove('sel');a={b,ci,p};b.classList.add('sel');return}
   if(a.p===p){[a.b,b].forEach(x=>{x.disabled=true;x.className+=' done'});a=null;if(!--n)ok()}
   else{a.b.classList.remove('sel');a=null;bad()}
  });d.appendChild(b)});$('.mt').appendChild(d)});
}
function gq(st){
 const k=st.k,ans=k==='q'?st.en:k==='h'?st.ar:st.a;
 $('#g').innerHTML=`<p class=q>${{q:'اختر الترجمة الإنجليزية',h:'استمع واختر المعنى',f:'أكمل الجملة',rq:'اقرأ ثم أجب'}[k]}</p>`+(k==='h'?'<button class=spk>🔊 استمع</button>':k==='rq'?`<div class=txt dir=ltr>${st.tx}</div><button class=spk>🔊 استمع للنص</button><button class=lnk id=tr>عرض الترجمة</button><p class=ar dir=auto>${st.q}</p>`:k==='f'&&st.dif>=6?'':`<p class=ar>${st.ar}</p>`)+(k==='f'?`<p class=bl>${st.bl}</p>`:'')+'<div class=opts></div>';
 if(k==='h'){$('.spk').onclick=()=>speak(st.en);setTimeout(()=>speak(st.en),300)}
 if(k==='rq'){$('.spk').onclick=()=>speak(st.tx);$('#tr').onclick=e=>{e.target.outerHTML='<p class=hint>'+st.tr+'</p>'}}
 st.o.forEach(o=>{const b=mk('c'+(k==='h'?'':' en'),o,()=>{
  if(o===ans){document.querySelectorAll('.opts button').forEach(x=>x.disabled=true);st.en&&speak(st.en);ok(st.en)}else{b.disabled=true;bad(ans)}});$('.opts').appendChild(b)});
}
function gb(st){
 const bank=sh([...st.en.split(' '),...st.x].map((w,i)=>({w,i})));let ans=[];
 $('#g').innerHTML=`<p class=q>ترجم الجملة</p><p class=ar>${st.ar}</p><div class=ans dir=ltr></div><div class=bank dir=ltr></div><button class=go>تحقق</button>`;
 const an=$('.ans'),bk=$('.bank');
 const draw=()=>{an.innerHTML='';bk.innerHTML='';
  ans.forEach((x,j)=>an.appendChild(mk('w',x.w,()=>{ans.splice(j,1);draw()})));
  bank.forEach(x=>{const b=mk('w',x.w,()=>{ans.push(x);speak(x.w);draw()});b.disabled=ans.includes(x);bk.appendChild(b)})};
 draw();
 $('.go').onclick=()=>{if(!ans.length)return;ans.map(x=>x.w).join(' ').toLowerCase()===st.en.toLowerCase()?ok(st.en):(ans=[],draw(),bad(st.en))};
}
function gd(st){
 const d=st.k==='d';
 $('#g').innerHTML=`<p class=q>${d?'اكتب ما تسمعه':'اكتب بالإنجليزية'}</p>`+(d?`<button class=spk>🔊 استمع</button>${st.dif>=4?'':`<p class=hint>المعنى: ${st.ar}</p>`}`:`<p class=ar>${st.ar}</p>`)+`<input id=in dir=ltr autocomplete=off autocapitalize=off spellcheck=false aria-label="إجابتك"><button class=go>تحقق</button>`;
 if(d){$('.spk').onclick=()=>speak(st.en);setTimeout(()=>speak(st.en),300)}
 const chk=()=>norm($('#in').value)===norm(st.en)?ok(st.en):(bad(st.en),$('#in')&&($('#in').value=''));
 $('.go').onclick=chk;$('#in').onkeydown=e=>{if(e.key==='Enter')chk()};
}
function exam(){
 const s=ST[cur],ix=ORDER.indexOf(s.k),K=ix<2?['q','t','h','f','b','sd','d']:['t','f','b','sd','d','t','sd'],xs=[];
 for(let n=0;n<10+2*ix;n++){const tp=rnd(s.t),c=rnd(K),sen=['b','f','sd'].includes(c)&&tp.s.length;xs.push(G[c==='sd'?'d':c](rnd(sen?tp.s:tp.w),s,ix*2+2))}
 S={s,i:0,k:0,h:3,xs,x:1,miss:0};step();
}
function fin(){
 const t=S.xs.length,sc=t-S.miss,th=.8+Math.min(.1,ORDER.indexOf(S.s.k)*.02),p=sc/t>=th;if(p){sp(S.s.k).x=1;save()}
 A.innerHTML=`<h1>${p?'نجحت! 🎓':'لم تجتز بعد'}</h1><p class=sub>نتيجتك ${sc} من ${t}. الحد الأدنى للنجاح ${Math.round(th*100)}%.</p>${p?'<div class=pass>تم فتح المرحلة التالية</div>':'<p>راجع الدروس ثم أعد الاختبار بأسئلة جديدة.</p>'}<button class=go onclick="${p?'home()':'exam()'}">${p?'الخريطة':'أعد الاختبار'}</button>${p?'':'<button class=lnk onclick="home()">الخريطة</button>'}`;
}
function review(){
 if(!P.wrong.length)return note('لا توجد أخطاء للمراجعة 👏');
 const s=ST[0];S={s,i:0,k:0,h:3,rv:1,xs:sh(P.wrong).slice(0,8).map((it,j)=>G[['q','t','h'][j%3]](it,s,1))};step();
}
function rvEnd(){A.innerHTML=`<h1>انتهت المراجعة ✅</h1><p class=sub>بقي ${P.wrong.length} من الأخطاء.</p><button class=go onclick="home()">الخريطة</button>`}
function backup(){
 A.innerHTML=`<h1>نسخ احتياطي</h1><p class=sub>انسخ النص واحفظه. للاستعادة الصق نسخة قديمة هنا ثم اضغط استيراد.</p><textarea id=bk rows=8 dir=ltr style="width:100%">${JSON.stringify(P)}</textarea><button class=go onclick="try{P=JSON.parse($('#bk').value);save();home()}catch(e){note('النص غير صالح')}">استيراد</button><button class=lnk onclick="home()">رجوع</button>`;
}
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0)navigator.serviceWorker.register('sw-en.js').catch(()=>{});
home();
</script></body></html>
