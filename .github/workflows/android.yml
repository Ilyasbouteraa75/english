name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html ads.js www/
          sed -i 's#</body>#<script src="ads.js"></script></body>#' www/index.html

      - name: Add Capacitor and AdMob
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor-community/admob@6
          npx cap add android
          npx cap sync android

      - name: Add AdMob test app id
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</application>#<meta-data android:name="com.google.android.gms.ai.APPLICATION_ID_PLACEHOLDER" android:value="x"/></application>#' $M
          sed -i 's#com.google.android.gms.ai.APPLICATION_ID_PLACEHOLDER#com.google.android.gms.ads.APPLICATION_ID#; s#android:value="x"#android:value="ca-app-pub-3940256099942544~3347511713"#' $M

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: english-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
